name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e . pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller --name TraktorPlaylistConverter --windowed --onefile main.py

      - name: Package macOS artifact
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r TraktorPlaylistConverter-macOS.zip TraktorPlaylistConverter.app

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/TraktorPlaylistConverter.exe -DestinationPath dist/TraktorPlaylistConverter-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ runner.os }}
          path: dist/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: artifacts/*.zip

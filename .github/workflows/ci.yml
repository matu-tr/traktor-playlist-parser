name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  gui-smoke:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install headless Qt runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3
      - run: pip install -e ".[dev]"
      - name: Import GUI and build the main window
        run: |
          python -c "
          import sys
          from PySide6.QtWidgets import QApplication
          from traktor_export.gui.main_window import MainWindow
          from traktor_export.gui.field_format_dialog import FieldFormatDialog
          from traktor_export.parsers.html_parser import parse_html_playlist
          from traktor_export.parsers.nml_parser import parse_nml_playlist

          app = QApplication(sys.argv)
          window = MainWindow()

          html_result = parse_html_playlist('wats04.html')
          FieldFormatDialog(html_result, window)

          nml_result = parse_nml_playlist('wats04.nml')
          FieldFormatDialog(nml_result, window)

          print('GUI smoke test OK')
          "
